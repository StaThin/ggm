format:
  html:
    code-fold: true
    code-summary: "R"
    html-math-method: mathjax
    include-in-header:
      - micro.html
      - text: |
          <script>
          window.MathJax = {
            tex: { tags: 'ams' },
            chtml: {
              scale: 0.95,
              /* Istruzione chiave: eredita il font Helvetica dal documento */
              mtextInheritFont: true 
            }
          };
          </script>
          <style>
            /* I tuoi tuning originali per la dimensione */
            .mjx-chtml { font-size: 1.1em !important; }
            
            /* I nuovi selettori per forzare Helvetica (al posto di .katex) */
            mjx-utext, mjx-stext, .mjx-utext { 
              font-family: "Helvetica Neue", Arial, sans-serif !important;
              font-size: 0.90em !important;
              font-style: normal !important;
              letter-spacing: -0.01em;
            }
          </style>
    font-family: "Helvetica Neue"
    toc: true
    toc-location: left
    toc-depth: 2
    toc-expand: true
    number-sections: true
    number-depth: 2
    callout-icon: false
    callout-appearance: simple
    fig-cap-align: center
    fig-width: 9
    fig-format: retina
    fontsize: 11pt
  pdf: 
    latex-auto-install: false
    pdf-engine: pdflatex
    latex-tinytex: false 
    fig-format: pdf
    fig-dpi: 300
    fig-width: 5
    fig-asp: 1
    keep-tex: true
    documentclass: scrreprt
    toc: true
    number-sections: true
    colorlinks: true
    include-in-header:
      - text: \usepackage{amsmath}
      - text: \usepackage{microtype}
      - micro.tex
execute:
  fig-align: center 
editor: 
  markdown: 
    wrap: 72

